name: Lighthouse CI
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install LHCI
        run: npm i -g @lhci/cli@0.12.x
      - name: Run Lighthouse (desktop)
        run: lhci autorun --collect.url="https://automate-site-immersion-01-lqf8iin0l.vercel.app/?v=blk2" --collect.settings.preset=desktop --upload.target=temporary-public-storage
      - name: Run Lighthouse (mobile)
        run: lhci autorun --collect.url="https://automate-site-immersion-01-lqf8iin0l.vercel.app/?v=blk2" --collect.settings.preset=perf --upload.target=temporary-public-storage
